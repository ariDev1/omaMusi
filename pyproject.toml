[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omaMusi"
version = "0.3.6"
description = "A local music player with a live audio visualization and playlist"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "numpy>=1.26,<3", "PyOpenGL>=3.1.7,<4"]

[project.scripts]
omaMusi = "omamusi.app:main"

[tool.setuptools.packages.find]
include = ["omamusi*"]
