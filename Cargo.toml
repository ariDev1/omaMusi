[package]
name = "omamusi"
version = "0.11.0"
edition = "2024"
license = "MIT"
description = "A local Linux music player with live audio visuals"
repository = "https://github.com/ariDev1/omaMusi"
autotests = false

[[bin]]
name = "omaMusi"
path = "src/main.rs"

[[test]]
name = "desktop"
path = "tests/rust/desktop.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-casefold = "0.2"
tempfile = "3"
cpal = { version = "0.18.2", features = ["pulseaudio"] }
rtrb = "0.3"
rustfft = "6.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
fastrand = "2"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_6"] }
cairo-rs = { version = "0.22", features = ["png"] }
gl = "0.14"
libloading = "0.8"
clap = { version = "4.5", features = ["derive"] }
toml = "1"

[[test]]
name = "cli"
path = "tests/rust/cli.rs"

[[test]]
name = "theme"
path = "tests/rust/theme.rs"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[[test]]
name = "render"
path = "tests/rust/render.rs"

[[test]]
name = "artwork"
path = "tests/rust/artwork.rs"

[[test]]
name = "gallery"
path = "tests/rust/gallery.rs"

[[test]]
name = "analysis"
path = "tests/rust/analysis.rs"

[[test]]
name = "audio"
path = "tests/rust/audio.rs"

[[test]]
name = "core"
path = "tests/rust/core.rs"

[[test]]
name = "state"
path = "tests/rust/state.rs"

[[test]]
name = "background"
path = "tests/rust/background.rs"
