[package]
name = "omamusi"
version = "0.11.0"
edition = "2024"
license = "MIT"
description = "A local Linux music player with live audio visuals"
repository = "https://github.com/ariDev1/omaMusi"
autotests = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-casefold = "0.2"
tempfile = "3"

[[test]]
name = "core"
path = "tests/rust/core.rs"
