name: Regression tests

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            dependencies: 'PySide6==6.7.0 numpy==1.26.4 PyOpenGL==3.1.7'
          - python: '3.14'
            dependencies: ''
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_PLATFORMTHEME: ''
      QT_STYLE_OVERRIDE: Fusion
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio libegl1 libgl1 libopengl0 libxkbcommon0
      - name: Install player and test dependency versions
        env:
          TEST_DEPENDENCIES: ${{ matrix.dependencies }}
        run: python -m pip install -e . $TEST_DEPENDENCIES
      - name: Run regression suite with a virtual audio output
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/omamusi-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=omamusi_test rate=48000
          pactl set-default-sink omamusi_test
          python -m unittest discover -v -s tests
      - name: Verify packaging
        run: python -m pip wheel --no-deps . --wheel-dir dist
