name: Rust verification

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: '1.92.0'
          - os: ubuntu-24.04
            rust: stable
    steps:
      - uses: actions/checkout@v6
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libasound2-dev libpulse-dev libepoxy-dev pkg-config ffmpeg pulseaudio xvfb openbox libgl1-mesa-dri desktop-file-utils
      - name: Select compiler
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
          rustup override set "${{ matrix.rust }}"
          rustc --version
          pkg-config --modversion gtk4
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Core, rendering and isolated installation tests
        run: cargo test --locked
      - name: Native audio and desktop workflows
        run: xvfb-run -a dbus-run-session bash scripts/test-desktop.sh
      - name: Package native release
        run: |
          cargo build --locked --release --bin omaMusi
          mkdir -p dist/omaMusi
          cp target/release/omaMusi LICENSE README.md dist/omaMusi/
          cp assets/UNICODE-LICENSE.txt dist/omaMusi/
          tar -C dist -czf dist/omaMusi-${{ matrix.os }}-${{ matrix.rust }}.tar.gz omaMusi
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.rust }}
          path: dist/*.tar.gz
          if-no-files-found: error
